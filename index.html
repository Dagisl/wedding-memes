<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Повтори мем 📸</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="start-screen" class="container">

    <h1>🎉 Мем-челлендж 🎉</h1>

    <p class="instructions">
        1. Нажмите кнопку ниже<br>
        2. Найдите напарника и подходящее место<br>
	3. Повторите выпавший мем<br>
        4. Сделайте фото на Polaroid<br>
        5. Оставьте снимок на память ❤️
    </p>

    <button onclick="startGame()">
        🎲 Получить мем
    </button>

</div>

<div id="meme-screen" class="container hidden">

    <h1>Повторите этот мем 📸</h1>

    <img id="meme" src="" alt="Мем">

    <div class="buttons">

        <button onclick="newMeme()">
            🔄 Дай другой мем
        </button>

        <button onclick="goHome()">
            🏠 На главную
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
